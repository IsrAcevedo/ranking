{% extends "base.html" %}
{% block content %}
<div
    class="md:w-2/5 w-5/6 mx-auto fondo_secundario mt-14 rounded-2xl p-8 h-auto flex items-center justify-center flex-col">
    <h3 class="text-center uppercase font-bold">programas de formacion</h3>
    <form action="/admin" method="POST" class="flex flex-col justify-between items-center h-2/3 w-5/6 mt-7 ">
        <div>

            <select name="ficha" id="ficha" required class="text-xl font-black outline-none">
                <option value="">seleccione</option>
                {%for curso in cursos%}
                <option value="{{curso.ficha}}">{{curso.ficha}}</option>
                {%endfor%}
            </select>
        </div>
        <div>
            <input class="cursor-pointer text-white uppercase font-bold px-8 py-2 rounded-2xl mt-10 fondo_verde"
                type="submit" value="Ingresar">
        </div>

    </form>

    <div class="flex flex-col sm:flex-row justify-between w-full mt-16 sm:gap-5 gap-3 text-center ">
        <a href="{{url_for('crear_curso')}}"
            class="sombra_verde p-2 rounded-md font-semibold  hover:bg-lime-800 hover:text-white transition-all duration-800 ">añadir
            programa de formacion</a>
        <a href="{{url_for('añadir_aprendiz')}}"
            class="sombra_verde p-2 rounded-md font-semibold   hover:bg-lime-800 hover:text-white transition-all duration-800 ">añadir
            aprenidz</a>
        <a href="{{url_for('nueva_entrada')}}"
            class="sombra_verde p-2 rounded-md font-semibold  hover:bg-lime-800 hover:text-white transition-all duration-800 ">escribir
            blog</a>


    </div>

    <!-- Ventana Modal de Selección de Curso -->
    <div id="modal-ranking" class="fixed inset-0 z-[100] hidden overflow-y-auto" aria-labelledby="modal-title"
        role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <!-- Background overlay -->
            <div class="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity" aria-hidden="true"
                onclick="document.getElementById('modal-ranking').classList.add('hidden')"></div>

            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

            <!-- Modal panel -->
            <div
                class="relative z-10 inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4 border-b border-gray-100">
                    <div class="sm:flex sm:items-start">
                        <div
                            class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-green-100 sm:mx-0 sm:h-10 sm:w-10">
                            <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                                </path>
                            </svg>
                        </div>
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-xl leading-6 font-bold text-gray-900 fuente_titulo" id="modal-title">
                                Selecciona un Curso
                            </h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500 mb-4">Elige la ficha de formación para visualizar el
                                    ranking de sus aprendices.</p>

                                <form id="form-filtro-ranking" action="/ranking" method="POST" class="w-full">
                                    <div class="mb-4 text-left">
                                        <label for="ficha" class="block text-sm font-bold text-gray-700 mb-2">Programa
                                            de Formación</label>
                                        <select id="ficha" name="ficha" required
                                            class="block w-full pl-3 pr-10 py-3 text-base border-gray-300 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm rounded-xl border bg-gray-50 text-gray-800 font-medium">
                                            <option value="" disabled selected>Seleccione un programa...</option>
                                            {% for programa in programas %}
                                            <option value="{{ programa.ficha }}">{{ programa.nombre_curso }} (Ficha: {{
                                                programa.ficha }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="mt-5 sm:mt-6 sm:flex sm:flex-row-reverse gap-3">
                                        <button type="submit"
                                            class="w-full inline-flex justify-center rounded-xl border border-transparent shadow-sm px-4 py-2 bg-[#2e7d32] text-base font-bold text-white hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 sm:w-auto sm:text-sm transition-colors">
                                            Ver Ranking
                                        </button>
                                        <button type="button"
                                            onclick="document.getElementById('modal-ranking').classList.add('hidden')"
                                            class="mt-3 w-full inline-flex justify-center rounded-xl border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-bold text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 sm:mt-0 sm:w-auto sm:text-sm transition-colors">
                                            Cancelar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
