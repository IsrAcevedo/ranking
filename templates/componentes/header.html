<header
    class="fixed top-0 left-0 w-full z-50 bg-[#212121] border-b-4 border-[#39A900] shadow-lg transition-all duration-300">
    <div
        class="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center px-4 py-3 lg:px-6 lg:py-4 w-full">

        <!-- Mobile Top Bar: Logo + Acciones Mobile -->
        <div class="flex justify-between items-center w-full lg:w-auto">
            <!-- 1. Logo -->
            <a href="{{url_for('index')}}" class="flex items-center gap-2 group">
                <span class="text-2xl group-hover:scale-110 transition-transform">🏆</span>
                <h1 class="text-xl lg:text-2xl text-white tracking-wide uppercase fuente_titulo">Ranking <span
                        class="text-[#39A900]">SENA</span></h1>
            </a>

            <!-- Acciones Mobile (Instructor + Menu) -->
            <div class="flex lg:hidden items-center gap-2">
                {%if usuario%}
                <a href="{{url_for('panel')}}"
                    class="bg-transparent border border-[#39A900] text-[#39A900] font-bold py-1.5 px-3 rounded-lg text-xs uppercase">Panel</a>
                {%else%}
                <a href="{{url_for('login')}}"
                    class="bg-[#39A900] text-white font-bold py-1.5 px-3 rounded-lg text-[10px] uppercase tracking-wide">Instructor</a>
                {%endif%}

                <button id="btn-hamburguesa" class="text-gray-300 hover:text-white focus:outline-none p-1 ml-1">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 2. Barra de Navegación -->
        <nav id="menu-navegacion"
            class="hidden lg:flex flex-col lg:flex-row justify-center items-center w-full lg:w-auto gap-4 lg:gap-6 font-medium uppercase text-sm text-gray-300 mt-4 lg:mt-0 border-t border-gray-700 lg:border-0 pt-4 lg:pt-0">
            <a href="{{url_for('index')}}"
                class="hover:text-[#39A900] transition-colors relative group py-2 lg:py-0 w-full lg:w-auto text-center">
                Inicio
                <span
                    class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#39A900] transition-all group-hover:w-full hidden lg:block"></span>
            </a>
            <a href="/#ranking"
                class="hover:text-[#39A900] transition-colors relative group py-2 lg:py-0 w-full lg:w-auto text-center">
                Ranking
                <span
                    class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#39A900] transition-all group-hover:w-full hidden lg:block"></span>
            </a>
            <a href="/#programas"
                class="hover:text-[#39A900] transition-colors relative group py-2 lg:py-0 w-full lg:w-auto text-center">
                Programas
                <span
                    class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#39A900] transition-all group-hover:w-full hidden lg:block"></span>
            </a>
            <a href="/#buscador"
                class="hover:text-[#39A900] transition-colors relative group py-2 lg:py-0 w-full lg:w-auto text-center lg:hidden xl:block">
                Buscar Aprendiz
                <span
                    class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#39A900] transition-all group-hover:w-full hidden lg:block"></span>
            </a>
            <a href="/#como-funciona"
                class="hover:text-[#39A900] transition-colors relative group py-2 lg:py-0 w-full lg:w-auto text-center lg:hidden xl:block">
                Cómo funciona
                <span
                    class="absolute -bottom-1 left-0 w-0 h-0.5 bg-[#39A900] transition-all group-hover:w-full hidden lg:block"></span>
            </a>
            {%if usuario%}
            <!-- Salir mobile -->
            <a href="{{url_for('cerrar_sesion')}}"
                class="lg:hidden text-red-500 font-bold py-2 w-full text-center">SALIR</a>
            {%endif%}
        </nav>

        <!-- 3. Boton Soy Instructor (Desktop) -->
        <div class="hidden lg:flex lg:w-1/4 justify-end gap-3">
            {%if usuario%}
            <a href="{{url_for('panel')}}"
                class="bg-transparent border border-[#39A900] text-[#39A900] hover:bg-[#39A900] hover:text-white font-bold py-2 px-5 rounded-lg shadow-sm transition-all duration-300 uppercase text-xs lg:text-sm">Panel</a>
            <a href="{{url_for('cerrar_sesion')}}"
                class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-5 rounded-lg shadow-sm transition-all duration-300 uppercase text-xs lg:text-sm">Salir</a>
            {%else%}
            <a href="{{url_for('login')}}"
                class="bg-[#39A900] hover:bg-green-700 text-white font-bold py-2 px-4 lg:px-6 rounded-lg shadow-md transition-all duration-300 uppercase text-xs lg:text-sm flex items-center gap-2">
                Soy Instructor
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1">
                    </path>
                </svg>
            </a>
            {%endif%}
        </div>
    </div>
</header>
